server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.csr.html;

    location / {
        try_files $uri /index.csr.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
