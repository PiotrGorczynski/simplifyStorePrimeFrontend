<p-toast position="top-center"></p-toast>

<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="logo-section">
      <img [src]="getLogoPath()" alt="Logo" class="main-logo" style="max-height: 350px;">
    </div>

    <div *ngIf="invalidToken" class="text-center">
      <i class="pi pi-exclamation-triangle text-5xl text-orange-500 mb-3 block"></i>
      <h2>Invalid Reset Link</h2>
      <p class="text-500 mb-4">This password reset link is invalid or has expired.</p>
      <p-button label="Back to Login" icon="pi pi-arrow-left" routerLink="/login"></p-button>
    </div>

    <div *ngIf="isReset && !invalidToken" class="text-center">
      <i class="pi pi-check-circle text-5xl text-green-500 mb-3 block"></i>
      <h2>Password Reset!</h2>
      <p class="text-500">Your password has been changed. Redirecting to login...</p>
    </div>

    <div *ngIf="!isReset && !invalidToken">
      <h2 class="text-center mb-2">Set New Password</h2>
      <p class="text-center text-500 mb-4">Enter your new password below</p>

      <div class="field mb-3">
        <label class="block font-bold mb-2">New Password</label>
        <p-password
          [(ngModel)]="newPassword"
          [toggleMask]="true"
          [feedback]="true"
          placeholder="Min. 6 characters"
          styleClass="w-full"
          inputStyleClass="w-full"
          (onBlur)="passwordTouched = true">
        </p-password>
        <small *ngIf="passwordTouched && newPassword.length < 6" class="text-red-500">
          <i class="pi pi-exclamation-circle"></i> Minimum 6 characters
        </small>
      </div>

      <div class="field mb-4">
        <label class="block font-bold mb-2">Confirm Password</label>
        <p-password
          [(ngModel)]="confirmPassword"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="Repeat password"
          styleClass="w-full"
          inputStyleClass="w-full"
          (onBlur)="confirmTouched = true">
        </p-password>
        <small *ngIf="confirmTouched && !passwordsMatch()" class="text-red-500">
          <i class="pi pi-exclamation-circle"></i> Passwords do not match
        </small>
      </div>

      <p-button
        label="Reset Password"
        icon="pi pi-lock"
        styleClass="w-full"
        [loading]="isLoading"
        (onClick)="onSubmit()">
      </p-button>

      <div class="text-center mt-4">
        <a routerLink="/login" class="text-primary no-underline hover:underline">
          <i class="pi pi-arrow-left mr-1"></i>Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
